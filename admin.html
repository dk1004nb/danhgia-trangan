<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Quản trị – Đánh giá lái đò Tràng An</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2a24;--muted:#5d6b64;--line:#e3ddd0;--bg:#f5f1e8;--card:#fffdf8;--green:#1f4d3a;--green-2:#2f6b52;--water:#3f8f86;--gold:#e3a51f;--red:#b3402f;--red-bg:#fbe9e5;--amber-bg:#fff3d6}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  /* login */
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 10px 30px rgba(31,77,58,.08)}
  .auth small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .auth h1{margin:4px 0 18px;font-size:20px;color:var(--green)}
  .auth p.note{font-size:13px;color:var(--muted);line-height:1.5;margin:-6px 0 14px}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input.i,select.i,textarea.i{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
  input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--water)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--green);white-space:nowrap}
  .btn:hover{border-color:var(--green-2)}
  .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
  .btn.pri:hover{background:var(--green-2)}
  .btn.danger{color:var(--red);border-color:#e6c2ba}
  .btn.danger.fill{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.block{width:100%;padding:12px;margin-top:16px;font-size:15px}
  .err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px}
  /* layout */
  header{background:var(--green);color:#fff}
  .hd{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hd .brand{flex:1;min-width:200px}
  .hd small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  .hd b{font-size:17px}
  .who{font-size:13px;text-align:right;line-height:1.35}
  .who em{font-style:normal;opacity:.75}
  .hd .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
  nav{background:var(--green-2)}
  nav .in{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;overflow-x:auto}
  nav button{border:0;background:none;color:rgba(255,255,255,.78);padding:11px 12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-bottom-color:var(--gold)}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:24px;font-weight:700;color:var(--green);margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi.warn .v{color:var(--red)}
  .seg{display:inline-flex;background:#ece6d8;border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 20px}
  .crit .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar{height:7px;background:#ece6d8;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--water)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:default;background:#f7f3ea;position:sticky;top:0}
  th.s{cursor:pointer}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill.g{background:#e3f1ea;color:var(--green)}
  .pill.y{background:var(--amber-bg);color:#8a5a00}
  .pill.r{background:var(--red-bg);color:var(--red)}
  .pill.k{background:#eceae4;color:#666}
  /* ratings */
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .filters .i{font-size:14px;padding:8px 10px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
  .chk input{width:16px;height:16px;accent-color:var(--green)}
  .rv{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;display:flex;gap:12px}
  .rv.st-an{background:#fbf8f1;border-style:dashed}
  .rv.st-xoa{background:#fbf1ee;border-style:dashed}
  .rv .cb{padding-top:2px}
  .rv .bd{flex:1;min-width:0}
  .rv .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rv .id{font-weight:700;color:var(--green)}
  .rv .t{color:var(--muted);font-size:12px}
  .rv .avg{font-weight:700;font-variant-numeric:tabular-nums}
  .rv .avg.low{color:var(--red)}
  .rv .sc{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
  .rv .sc b{color:var(--ink)}
  .rv .c{margin-top:8px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#f7f3ea;border-radius:8px;padding:8px 10px}
  .rv .mod{margin-top:8px;font-size:12px;color:var(--red)}
  .rv .act{display:flex;flex-direction:column;gap:6px;flex:none}
  .bulk{position:sticky;bottom:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .bulk .btn{background:#fff}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .md{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .md h3{margin:0 0 6px}
  .md p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.5}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .loading{color:var(--muted);padding:20px;text-align:center}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
  @media (max-width:640px){
    .rv{flex-wrap:wrap}.rv .act{flex-direction:row;width:100%;padding-left:28px}
    .who{text-align:left}
  }
</style>
</head>
<body>
<script src="config.js"></script>

<!-- ĐĂNG NHẬP -->
<div class="auth" id="vLogin">
  <form class="box" id="fLogin" autocomplete="on">
    <small>Khu du lịch sinh thái Tràng An</small>
    <h1>Quản trị đánh giá lái đò</h1>
    <div id="setupNote" class="hidden">
      <p class="note">Hệ thống chưa có tài khoản quản trị. Tạo tài khoản đầu tiên bằng <b>mật khẩu quản trị</b> của công cụ Python (mục Kết nối).</p>
      <label class="f" for="sKey">Mật khẩu quản trị (công cụ Python)</label>
      <input class="i" id="sKey" type="password" autocomplete="off">
      <label class="f" for="sName">Họ tên</label>
      <input class="i" id="sName" autocomplete="name">
    </div>
    <label class="f" for="lUser">Tên đăng nhập</label>
    <input class="i" id="lUser" autocomplete="username" autocapitalize="none" required>
    <label class="f" for="lPass">Mật khẩu</label>
    <input class="i" id="lPass" type="password" autocomplete="current-password" required>
    <div id="pwRule" class="hidden muted" style="font-size:12px;margin-top:6px">Tối thiểu 10 ký tự, có cả chữ và số.</div>
    <button class="btn pri block" id="bLogin" type="submit">Đăng nhập</button>
    <div class="err hidden" id="lErr"></div>
  </form>
</div>

<!-- ỨNG DỤNG -->
<div id="vApp" class="hidden">
  <header><div class="hd">
    <div class="brand"><small>Khu du lịch sinh thái Tràng An</small><b>Quản trị đánh giá người lái đò</b></div>
    <div class="who" id="who"></div>
    <button class="btn sm" id="bPw" type="button">Đổi mật khẩu</button>
    <button class="btn sm" id="bOut" type="button">Đăng xuất</button>
  </div></header>
  <nav><div class="in" id="tabs">
    <button data-v="ov" class="on">Tổng quan</button>
    <button data-v="rt">Đánh giá</button>
    <button data-v="dr">Người lái đò</button>
    <button data-v="pr">In thẻ &amp; QR</button>
    <button data-v="rp">Báo cáo</button>
    <button data-v="us" data-need="admin">Tài khoản</button>
    <button data-v="lg" data-need="kiemduyet">Nhật ký</button>
    <button data-v="st" data-need="admin">Cài đặt</button>
  </div></nav>
  <main>
    <section id="pOv"></section>
    <section id="pRt" class="hidden">
      <div class="card">
        <div class="filters">
          <input class="i" id="fId" placeholder="Mã số (VD: TA-0001)" autocapitalize="characters">
          <input class="i" id="fFrom" type="date" title="Từ ngày">
          <input class="i" id="fTo" type="date" title="Đến ngày">
          <select class="i" id="fSt">
            <option value="all">Đang hiển thị + đã ẩn</option>
            <option value="visible">Chỉ đang hiển thị</option>
            <option value="hidden">Chỉ đã ẩn</option>
            <option value="deleted">Chỉ đã xóa</option>
          </select>
          <input class="i" id="fQ" placeholder="Tìm trong nhận xét">
        </div>
        <div class="row" style="margin-top:10px">
          <label class="chk"><input type="checkbox" id="fLow"> Điểm thấp (≤ 2,5)</label>
          <label class="chk"><input type="checkbox" id="fTip"> Phản ánh xin tiền / ép mua</label>
          <label class="chk"><input type="checkbox" id="fCm"> Có nhận xét</label>
          <span class="sp"></span>
          <button class="btn sm" id="bReset" type="button">Xóa lọc</button>
          <button class="btn sm pri" id="bFind" type="button">Lọc</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:8px">
        <label class="chk" id="allWrap"><input type="checkbox" id="cAll"> Chọn cả trang</label>
        <span class="sp"></span><span class="muted" id="rtCount"></span>
      </div>
      <div id="rtList"></div>
      <div class="pager" id="pager"></div>
      <div class="bulk hidden" id="bulk"></div>
    </section>
    <section id="pDr" class="hidden"></section>
    <section id="pPr" class="hidden"></section>
    <section id="pRp" class="hidden"></section>
    <section id="pUs" class="hidden"></section>
    <section id="pLg" class="hidden"></section>
    <section id="pSt" class="hidden"></section>
  </main>
</div>

<div id="modal"></div>
<div id="toast" class="toast hidden"></div>

<script>
(function () {
  'use strict';
  var API = (window.TA_CONFIG || {}).api || '';
  var TK = 'ta_adm_token';
  var S = { token: null, user: null, roles: {}, days: 30, stats: null, sort: { k: 'overall', d: 1 }, page: 0, rows: [], sel: {}, users: [] };
  var RANK = { admin: 3, kiemduyet: 2, xem: 1 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(x, d) { return x == null || isNaN(x) ? '–' : Number(x).toFixed(d == null ? 2 : d).replace('.', ','); }
  function dt(ms) { if (!ms) return ''; var d = new Date(ms); function p(n) { return ('0' + n).slice(-2); } return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function can(r) { return S.user && RANK[S.user.role] >= RANK[r]; }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.add('hidden'); }, 3200); }

  /* Gọi API: không gửi cookie Google, yêu cầu "simple" (không preflight) */
  function api(body) {
    if (S.token && !body.token) body.token = S.token;
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('Lỗi máy chủ (' + r.status + ')'); return r.json(); })
      .then(function (j) {
        if (j && j.error === 'SESSION') { logout(true); throw new Error(j.message || 'Phiên đăng nhập đã hết hạn.'); }
        if (!j || !j.ok) throw new Error((j && j.error) || 'Có lỗi xảy ra');
        return j;
      }, function (e) { if (e instanceof TypeError) throw new Error('Không kết nối được máy chủ. Kiểm tra mạng.'); throw e; });
  }

  /* ---------- đăng nhập ---------- */
  var setupMode = false;
  function showLogin(msg) {
    $('vApp').classList.add('hidden'); $('vLogin').classList.remove('hidden');
    if (msg) { $('lErr').textContent = msg; $('lErr').classList.remove('hidden'); }
    api({ action: 'auth_status' }).then(function (j) {
      setupMode = !j.hasUsers;
      $('setupNote').classList.toggle('hidden', !setupMode);
      $('pwRule').classList.toggle('hidden', !setupMode);
      $('bLogin').textContent = setupMode ? 'Tạo tài khoản và đăng nhập' : 'Đăng nhập';
      $('lPass').autocomplete = setupMode ? 'new-password' : 'current-password';
    }).catch(function (e) { $('lErr').textContent = e.message; $('lErr').classList.remove('hidden'); });
  }
  $('fLogin').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = $('bLogin'); b.disabled = true; $('lErr').classList.add('hidden');
    var body = setupMode
      ? { action: 'auth_setup', key: $('sKey').value, name: $('sName').value, username: $('lUser').value, password: $('lPass').value }
      : { action: 'auth_login', username: $('lUser').value, password: $('lPass').value };
    api(body).then(function (j) {
      S.token = j.token; S.user = j.user; S.roles = j.roles || {};
      try { sessionStorage.setItem(TK, j.token); } catch (e) {}
      $('lPass').value = ''; $('sKey').value = '';
      start();
    }).catch(function (e) { $('lErr').textContent = e.message; $('lErr').classList.remove('hidden'); })
      .then(function () { b.disabled = false; });
  });
  function logout(silent) {
    if (!silent && S.token) api({ action: 'adm_logout' }).catch(function () {});
    S.token = null; S.user = null;
    try { sessionStorage.removeItem(TK); } catch (e) {}
    showLogin(silent ? 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.' : '');
  }
  $('bOut').onclick = function () { logout(false); };

  function start() {
    $('vLogin').classList.add('hidden'); $('vApp').classList.remove('hidden');
    $('who').innerHTML = '<b>' + esc(S.user.name) + '</b><br><em>' + esc(S.user.username) + ' · ' + esc(S.roles[S.user.role] || S.user.role) + '</em>';
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('hidden', !!b.dataset.need && !can(b.dataset.need));
    });
    if (!can('kiemduyet')) { $('allWrap').classList.add('hidden'); }
    go('ov');
  }

  /* ---------- điều hướng ---------- */
  var PANES = { ov: 'pOv', rt: 'pRt', dr: 'pDr', pr: 'pPr', rp: 'pRp', us: 'pUs', lg: 'pLg', st: 'pSt' };
  function go(v) {
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.v === v); });
    for (var k in PANES) $(PANES[k]).classList.toggle('hidden', k !== v);
    if (v === 'ov') loadOv();
    if (v === 'rt') loadRt();
    if (v === 'us') loadUs();
    if (v === 'lg') loadLg();
    if (v === 'st') loadSt();
    var tool = (window.TA_TOOLS || {})[v];
    if (tool) tool();
    else if (PANES[v] && !$(PANES[v]).innerHTML && /^(dr|pr|rp)$/.test(v)) $(PANES[v]).innerHTML = '<div class="err">Chưa tải được mô-đun công cụ (admin-tools.js). Kiểm tra mạng rồi tải lại trang.</div>';
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) go(b.dataset.v); });

  /* ---------- tổng quan ---------- */
  function loadOv() {
    var p = $('pOv'); p.innerHTML = '<div class="loading"><span class="spin"></span>Đang tải số liệu…</div>';
    api({ action: 'adm_stats', days: S.days }).then(function (j) { S.stats = j; renderOv(); })
      .catch(function (e) { p.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }
  function renderOv() {
    var j = S.stats, d = j.data, m = j.mod, list = d.drivers.filter(function (x) { return x.n > 0; });
    var tn = 0, ts = 0, low = 0, tip = 0, cs = d.criteria.map(function () { return 0; });
    list.forEach(function (x) { tn += x.n; ts += x.overall * x.n; low += x.low; tip += x.tip; x.avgs.forEach(function (a, i) { cs[i] += a * x.n; }); });
    var seg = [[7, '7 ngày'], [30, '30 ngày'], [90, '90 ngày'], [0, 'Toàn bộ']].map(function (o) {
      return '<button data-d="' + o[0] + '" class="' + (S.days === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('');
    var rows = d.drivers.slice().sort(function (a, b) {
      var k = S.sort.k, va = a[k], vb = b[k];
      if (va == null) va = -1; if (vb == null) vb = -1;
      return (typeof va === 'string' ? va.localeCompare(vb, 'vi') : va - vb) * (S.sort.d ? -1 : 1);
    });
    function th(k, l, n) { return '<th class="s' + (n ? ' n' : '') + '" data-k="' + k + '">' + l + (S.sort.k === k ? (S.sort.d ? ' ▼' : ' ▲') : '') + '</th>'; }
    function cls(x) { if (x.n < 20 || x.overall == null) return '<span class="pill k">Chưa đủ lượt</span>';
      return x.overall >= 4.5 ? '<span class="pill g">Xuất sắc</span>' : x.overall >= 4 ? '<span class="pill g">Tốt</span>' : x.overall >= 3.5 ? '<span class="pill y">Đạt</span>' : '<span class="pill r">Cần cải thiện</span>'; }
    $('pOv').innerHTML =
      '<div class="row" style="margin-bottom:12px"><div class="seg" id="seg">' + seg + '</div><span class="sp"></span>' +

        '<label class="f">Số lượt tối thiểu để hiện điểm</label><input class="i" id="sMin" type="number" min="1" max="100" value="' + s.minRatings + '">' +
        '<label class="f">Tính điểm trong bao nhiêu ngày gần nhất (0 = toàn bộ)</label><input class="i" id="sDays" type="number" min="0" max="3650" value="' + s.days + '">' +
        '<label class="f">Đường dây nóng hiển thị cho du khách</label><input class="i" id="sHot" value="' + esc(s.hotline) + '">' +
        '<label class="f">Địa chỉ trang công khai</label><input class="i" id="sSite" value="' + esc(s.siteUrl) + '" placeholder="https://alhd.asia/">' +
        '<div class="muted" style="font-size:12px;margin-top:4px">Đổi địa chỉ này sẽ cập nhật cột link trong bảng tính; cần in lại thẻ QR nếu địa chỉ thay đổi.</div>' +
        '<div class="err hidden" id="sErr"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" id="sSave">Lưu cài đặt</button></div></div>' +
        '<div class="card" style="max-width:560px"><h3>Email nhận cảnh báo</h3><p class="muted" style="font-size:13px;margin:0 0 8px">Gửi ngay khi có đánh giá thấp (≤ 2,5) hoặc phản ánh xin tiền / ép mua. Nhiều email cách nhau bằng dấu phẩy; để trống để tắt.</p>' +
        '<input class="i" id="aMail" placeholder="truongben@gmail.com, lanhdao@gmail.com"><div class="err hidden" id="aErr"></div>' +
        '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="aSave">Lưu email</button></div></div>';
      api({ action: 'adm_alert' }).then(function (a) { $('aMail').value = a.email; }).catch(function () {});
      $('aSave').onclick = function () {
        var b = this; b.disabled = true; $('aErr').classList.add('hidden');
        api({ action: 'adm_alert', email: $('aMail').value }).then(function (a) { $('aMail').value = a.email; toast(a.email ? 'Đã lưu email cảnh báo.' : 'Đã tắt email cảnh báo.'); })
          .catch(function (e) { $('aErr').textContent = e.message; $('aErr').classList.remove('hidden'); }).then(function () { b.disabled = false; });
      };
      $('sSave').onclick = function () {
        var b = this; b.disabled = true; $('sErr').classList.add('hidden');
        api({ action: 'adm_settings', settings: { showName: $('sShow').checked, minRatings: $('sMin').value, days: $('sDays').value, hotline: $('sHot').value, siteUrl: $('sSite').value.trim() } })
          .then(function () { toast('Đã lưu cài đặt.'); }).catch(function (e) { $('sErr').textContent = e.message; $('sErr').classList.remove('hidden'); })
          .then(function () { b.disabled = false; });
      };
    }).catch(function (e) { $('pSt').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }

  /* ---------- hộp thoại ---------- */
  function modal(html) {
    $('modal').innerHTML = '<div class="ov"><div class="md" role="dialog" aria-modal="true">' + html + '</div></div>';
    var ov = $('modal').firstChild;
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.hasAttribute('data-x')) closeModal(); });
    var f = ov.querySelector('input,textarea,select'); if (f) f.focus();
  }
  function closeModal() { $('modal').innerHTML = ''; }
  function showErr(m) { var e = $('mErr'); e.textContent = m; e.classList.remove('hidden'); }
  function confirmBox(t, d, btn, fn) {
    modal('<h3>' + esc(t) + '</h3><p>' + esc(d) + '</p><div class="err hidden" id="mErr"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-x>Hủy</button><button class="btn danger fill" id="mOk">' + esc(btn) + '</button></div>');
    $('mOk').onclick = function () { var b = this; b.disabled = true; fn().then(closeModal).catch(function (e) { showErr(e.message); b.disabled = false; }); };
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  /* ---------- dùng chung cho mô-đun công cụ (admin-tools.js) ---------- */
  window.TA = { api: api, S: S, $: $, esc: esc, fmt: fmt, dt: dt, can: can, fold: fold, toast: toast,
                modal: modal, closeModal: closeModal, showErr: showErr, confirmBox: confirmBox };

  /* ---------- khởi động ---------- */
  if (!API || /__API_URL__/.test(API)) { showLogin('Chưa cấu hình địa chỉ máy chủ (config.js).'); return; }
  var saved = null; try { saved = sessionStorage.getItem(TK); } catch (e) {}
  if (saved) {
    S.token = saved;
    api({ action: 'adm_me' }).then(function (j) { S.user = j.user; S.roles = j.roles; start(); }).catch(function () { if (!S.user) showLogin(''); });
  } else showLogin('');
})();
</script>
<script src="admin-tools.js"></script>
</body>
</html>
